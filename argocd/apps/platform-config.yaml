apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git-codecommit.ap-south-1.amazonaws.com/v1/repos/tenderflow-infra
    targetRevision: main
    path: platform-config/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: tenderflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
