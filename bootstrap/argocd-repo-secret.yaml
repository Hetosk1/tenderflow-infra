# Builds ArgoCD's repo credentials from SSM, so they survive every cluster rebuild
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-tenderflow-infra
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: repo-tenderflow-infra
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://git-codecommit.ap-south-1.amazonaws.com/v1/repos/tenderflow-infra
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: /tenderflow/argocd/git-username
    - secretKey: password
      remoteRef:
        key: /tenderflow/argocd/git-password
