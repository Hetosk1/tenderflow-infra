# One internet-facing ALB acting as the API gateway.
# The AWS Load Balancer Controller turns this Ingress into an ALB + one target group per Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenderflow
  namespace: tenderflow
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Route straight to pod IPs (VPC CNI), no NodePort hop
    alb.ingress.kubernetes.io/target-type: ip
    # Every backend answers /healthz: the 3 Node services and nginx
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # Prefixes match each service's app.use(...) mount
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 4001
          - path: /tender
            pathType: Prefix
            backend:
              service:
                name: tender-service
                port:
                  number: 4002
          - path: /quotation
            pathType: Prefix
            backend:
              service:
                name: quotation-service
                port:
                  number: 4003
          # Catch-all for the SPA, must stay last
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
