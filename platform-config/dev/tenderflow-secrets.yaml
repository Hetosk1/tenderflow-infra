# SSM Parameter Store -> Kubernetes Secret "tenderflow-secrets" in namespace tenderflow
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenderflow-secrets
  namespace: tenderflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: tenderflow-secrets
  data:
    - secretKey: MONGO_URI
      remoteRef:
        key: /tenderflow/mongo-uri
    - secretKey: REDIS_URI
      remoteRef:
        key: /tenderflow/redis-uri
    - secretKey: JWT_SECRET
      remoteRef:
        key: /tenderflow/jwt-secret
